<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>CHANTIER MANAGER</title>
<meta name="description" content="Gestion simple et intelligente de vos chantiers">
<meta name="theme-color" content="#1d4ed8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chantier Mgr">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* ===================== VARIABLES / THEME ===================== */
:root{
  --bg:#f3f5f8; --bg-elevated:#ffffff; --card-bg:#ffffff; --border:#e3e7ee;
  --text:#182233; --text-muted:#66708a; --text-soft:#8a93a8;
  --primary:#1d4ed8; --primary-dark:#1533a8; --primary-soft:#e8edfd;
  --accent:#f59e0b; --accent-soft:#fef3e0;
  --success:#16a34a; --success-soft:#e6f6ec;
  --danger:#dc2626; --danger-soft:#fdeaea;
  --warning:#d97706; --warning-soft:#fef3e0;
  --info:#0891b2; --info-soft:#e3f6fa;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.06);
  --shadow-lg:0 10px 30px rgba(20,30,60,.14);
  --sidebar-w:246px; --topbar-h:62px; --bottomnav-h:64px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0f141f; --bg-elevated:#161d2c; --card-bg:#161d2c; --border:#28324a;
  --text:#e8ecf6; --text-muted:#9aa4bd; --text-soft:#6f7994;
  --primary:#4b7bf5; --primary-dark:#split; --primary-dark:#3a63d6; --primary-soft:#1b2440;
  --accent:#f7b955; --accent-soft:#2b2210;
  --success:#34c26d; --success-soft:#0f2a1c;
  --danger:#f36464; --danger-soft:#2e1414;
  --warning:#f0a742; --warning-soft:#2b2210;
  --info:#3fc6e0; --info-soft:#0e2731;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 18px rgba(0,0,0,.35);
  --shadow-lg:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:14.5px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-.01em;}
p{margin:0;}
a{color:inherit;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit; font-size:14px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
.hidden{display:none !important;}

/* ===================== SPLASH ===================== */
#splash{
  position:fixed; inset:0; z-index:9999; background:linear-gradient(150deg,var(--primary-dark),var(--primary));
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
  transition:opacity .5s ease, visibility .5s ease; color:#fff;
}
#splash.out{opacity:0; visibility:hidden; pointer-events:none;}
.splash-logo{
  width:76px;height:76px;border-radius:20px;background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;font-size:34px;
  box-shadow:var(--shadow-lg); animation:pop .6s ease;
}
@keyframes pop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.splash-title{font-size:22px;font-weight:800;letter-spacing:.02em;}
.splash-sub{font-size:13px;opacity:.85;}
.splash-bar{width:160px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:8px;}
.splash-bar::after{content:'';display:block;height:100%;width:40%;background:#fff;border-radius:4px;animation:load 1s ease-in-out infinite;}
@keyframes load{0%{transform:translateX(-100%);}100%{transform:translateX(360%);}}

/* ===================== LOGIN ===================== */
.login-screen{
  position:fixed; inset:0; z-index:500; background:linear-gradient(150deg,var(--primary-dark),var(--primary));
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.login-box{
  background:var(--card-bg); border-radius:18px; box-shadow:var(--shadow-lg); padding:32px 28px;
  width:100%; max-width:340px; text-align:center;
}
.login-box h1{font-size:18px; margin-bottom:4px;}
.login-sub{font-size:12.5px; color:var(--text-muted); margin-bottom:20px;}
.login-box .form-group{text-align:left; margin-bottom:14px;}
.login-error{background:var(--danger-soft); color:var(--danger); font-size:12.5px; font-weight:600; padding:9px 12px; border-radius:9px; margin-bottom:14px; text-align:left;}

/* ===================== APP LAYOUT ===================== */
.app{display:flex; min-height:100vh;}
.sidebar{
  width:var(--sidebar-w); background:var(--bg-elevated); border-right:1px solid var(--border);
  position:fixed; top:0; left:0; bottom:0; display:flex; flex-direction:column; z-index:60;
  transition:transform .25s ease;
}
.brand{display:flex; align-items:center; gap:10px; padding:18px 18px 14px;}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;box-shadow:var(--shadow);flex-shrink:0;}
.brand-text h1{font-size:15.5px;line-height:1.15;}
.brand-text span{font-size:10.5px;color:var(--text-muted);display:block;margin-top:2px;}
.nav-list{list-style:none;margin:6px 0;padding:4px 10px;overflow-y:auto;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:11px; padding:10px 12px;border-radius:var(--radius-sm);
  color:var(--text-muted); cursor:pointer; font-weight:600; font-size:13.6px; margin-bottom:2px;
  transition:background .15s, color .15s;
}
.nav-item .ic{width:19px;text-align:center;font-size:15px;flex-shrink:0;}
.nav-item:hover{background:var(--primary-soft); color:var(--primary);}
.nav-item.active{background:var(--primary); color:#fff;}
.sidebar-footer{padding:12px 14px 16px;border-top:1px solid var(--border);}
.company-mini{display:flex;align-items:center;gap:9px;padding:8px;border-radius:var(--radius-sm);background:var(--bg);}
.company-mini .avatar{width:30px;height:30px;border-radius:9px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex-shrink:0;}
.company-mini .cn{font-size:12.3px;font-weight:700; overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.company-mini .cs{font-size:10.5px;color:var(--text-muted);}
.user-mini{display:flex;align-items:center;gap:9px;padding:8px;border-radius:var(--radius-sm);margin-top:6px;}
.user-mini .avatar{width:30px;height:30px;border-radius:9px;background:var(--success-soft);color:var(--success);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex-shrink:0;}
.user-mini .cn{font-size:12.3px;font-weight:700; overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.user-mini .cs{font-size:10.5px;color:var(--text-muted);}

.main{flex:1; margin-left:var(--sidebar-w); min-width:0; display:flex; flex-direction:column;}
.topbar{
  height:var(--topbar-h); background:var(--bg-elevated); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px; padding:0 20px; position:sticky; top:0; z-index:40;
}
.btn-icon{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--bg-elevated);
  color:var(--text); cursor:pointer; display:flex;align-items:center;justify-content:center;font-size:16px;
  transition:background .15s;
}
.btn-icon:hover{background:var(--primary-soft); color:var(--primary);}
#btnMenu{display:none;}
.search-wrap{flex:1; max-width:420px; position:relative;}
.search-wrap input{
  width:100%; padding:9px 14px 9px 36px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); outline:none; transition:border-color .15s;
}
.search-wrap input:focus{border-color:var(--primary);}
.search-wrap .sic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-soft);font-size:14px;}
#searchResults{
  position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--card-bg); border:1px solid var(--border);
  border-radius:var(--radius-sm); box-shadow:var(--shadow-lg); max-height:360px; overflow-y:auto; z-index:80;
}
#searchResults .sr-item{padding:9px 13px; cursor:pointer; border-bottom:1px solid var(--border); font-size:13px;}
#searchResults .sr-item:last-child{border-bottom:none;}
#searchResults .sr-item:hover{background:var(--primary-soft);}
#searchResults .sr-item small{display:block;color:var(--text-muted);font-size:11px;margin-top:1px;}
#searchResults .sr-empty{padding:14px;text-align:center;color:var(--text-muted);font-size:12.5px;}
.topbar-actions{display:flex;align-items:center;gap:9px; margin-left:auto;}
.quick-add-wrap{position:relative;}
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:10px; border:1px solid transparent;
  background:var(--primary); color:#fff; font-weight:700; font-size:13.3px; cursor:pointer; transition:filter .15s, transform .1s;
  white-space:nowrap;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.97);}
.btn-outline{background:transparent; border-color:var(--border); color:var(--text);}
.btn-outline:hover{background:var(--bg);}
.btn-ghost{background:transparent; color:var(--text-muted); border:none;}
.btn-ghost:hover{color:var(--text); background:var(--bg);}
.btn-danger{background:var(--danger);}
.btn-sm{padding:6px 11px; font-size:12.3px; border-radius:8px;}
.btn-block{width:100%; justify-content:center;}
.quick-add-menu{
  position:absolute; right:0; top:calc(100% + 8px); background:var(--card-bg); border:1px solid var(--border);
  border-radius:var(--radius-sm); box-shadow:var(--shadow-lg); width:220px; padding:6px; z-index:80;
  opacity:0; visibility:hidden; transform:translateY(-6px); transition:all .15s;
}
.quick-add-menu.open{opacity:1; visibility:visible; transform:translateY(0);}
.quick-add-menu button{
  width:100%; text-align:left; padding:9px 11px; border-radius:8px; border:none; background:none; color:var(--text);
  cursor:pointer; font-size:13px; font-weight:600; display:flex; align-items:center; gap:9px;
}
.quick-add-menu button:hover{background:var(--primary-soft); color:var(--primary);}

.view{padding:22px 26px 90px; max-width:1400px; width:100%; margin:0 auto;}
.view-head{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:20px; flex-wrap:wrap;}
.view-head h2{font-size:22px;}
.view-head .sub{color:var(--text-muted); font-size:13px; margin-top:3px;}
.view-actions{display:flex;gap:9px; flex-wrap:wrap;}

/* ===================== BOTTOM NAV (mobile) ===================== */
.bottom-nav{
  display:none; position:fixed; bottom:0; left:0; right:0; height:var(--bottomnav-h);
  background:var(--bg-elevated); border-top:1px solid var(--border); z-index:70;
  align-items:stretch; padding-bottom:env(safe-area-inset-bottom);
}
.bottom-nav .bn-item{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  color:var(--text-muted); font-size:10px; font-weight:700; cursor:pointer; border:none; background:none;
}
.bottom-nav .bn-item .ic{font-size:19px;}
.bottom-nav .bn-item.active{color:var(--primary);}

/* ===================== CARDS / KPI ===================== */
.grid{display:grid; gap:16px;}
.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.card{background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px;}
.kpi-card{display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden;}
.kpi-card .kpi-top{display:flex;align-items:center;justify-content:space-between;}
.kpi-card .kpi-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.kpi-card .kpi-val{font-size:22px; font-weight:800; letter-spacing:-.01em;}
.kpi-card .kpi-label{font-size:12px; color:var(--text-muted); font-weight:600;}
.kpi-card .kpi-trend{font-size:11px; font-weight:700; padding:2px 7px; border-radius:20px;}
.trend-up{color:var(--success); background:var(--success-soft);}
.trend-down{color:var(--danger); background:var(--danger-soft);}
.trend-neutral{color:var(--text-muted); background:var(--bg);}

.section-title{font-size:15px; font-weight:800; margin-bottom:2px;}
.card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}

/* ===================== TABLE ===================== */
.table-responsive{width:100%; overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13.3px;}
thead th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-soft);
  font-weight:700; padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap;
}
tbody td{padding:12px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{transition:background .12s;}
tbody tr:hover{background:var(--bg);}
td.num, th.num{text-align:right;}
.row-actions{display:flex; gap:6px; justify-content:flex-end;}
.table-empty{padding:40px 20px; text-align:center;}
.pager{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; padding-top:14px; border-top:1px solid var(--border); flex-wrap:wrap;}
.pager-info{font-size:12px; color:var(--text-muted); font-weight:600;}
.pager-btns{display:flex; gap:6px;}
.pager-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
.pager-btn:hover:not(:disabled){background:var(--primary-soft); color:var(--primary); border-color:var(--primary);}
.pager-btn:disabled{opacity:.4; cursor:default;}

@media (max-width:760px){
  .table-responsive table, .table-responsive thead, .table-responsive tbody, .table-responsive th, .table-responsive td, .table-responsive tr{display:block; width:100%;}
  .table-responsive thead{display:none;}
  .table-responsive tbody tr{margin-bottom:12px; border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px 12px; background:var(--card-bg);}
  .table-responsive tbody td{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 0; border:none; text-align:right;}
  .table-responsive tbody td::before{content:attr(data-label); font-weight:700; color:var(--text-muted); text-align:left; font-size:11.5px;}
  .table-responsive tbody td.row-actions-cell::before{content:'';}
  .table-responsive tbody td .row-actions{justify-content:flex-end; width:100%;}
}

/* ===================== BADGES ===================== */
.badge{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-size:11.3px; font-weight:700; white-space:nowrap;}
.badge::before{content:''; width:6px;height:6px;border-radius:50%;background:currentColor;}
.b-gray{background:var(--bg); color:var(--text-muted);}
.b-blue{background:var(--primary-soft); color:var(--primary);}
.b-green{background:var(--success-soft); color:var(--success);}
.b-red{background:var(--danger-soft); color:var(--danger);}
.b-orange{background:var(--warning-soft); color:var(--warning);}
.b-cyan{background:var(--info-soft); color:var(--info);}

/* ===================== FORMS ===================== */
.form-grid{display:flex; flex-wrap:wrap; gap:14px;}
.form-group{display:flex; flex-direction:column; gap:6px; flex:1 1 100%; min-width:0;}
.form-group.half{flex:1 1 calc(50% - 7px);}
.form-group.third{flex:1 1 calc(33.33% - 10px);}
.form-group label{font-size:12px; font-weight:700; color:var(--text-muted);}
.form-group input, .form-group select, .form-group textarea{
  padding:10px 12px; border-radius:9px; border:1px solid var(--border); background:var(--bg);
  color:var(--text); outline:none; transition:border-color .15s, background .15s; width:100%;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus{border-color:var(--primary); background:var(--card-bg);}
.form-group textarea{resize:vertical;}
.form-hint{font-size:11px; color:var(--text-soft);}
.form-section-label{font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--text-soft); margin:6px 0 -4px; width:100%;}
.checkbox-row{display:flex; align-items:center; gap:8px;}
.checkbox-row input{width:auto;}

/* ===================== MODAL ===================== */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,14,25,.5); z-index:200; display:flex; align-items:center; justify-content:center;
  padding:18px; opacity:0; visibility:hidden; transition:opacity .18s;
}
.modal-overlay.open{opacity:1; visibility:visible;}
.modal-box{
  background:var(--card-bg); border-radius:16px; width:100%; max-width:560px; max-height:88vh; display:flex; flex-direction:column;
  box-shadow:var(--shadow-lg); transform:translateY(10px) scale(.98); transition:transform .18s; overflow:hidden;
}
.modal-overlay.open .modal-box{transform:translateY(0) scale(1);}
.modal-box.wide{max-width:820px;}
.modal-box.xwide{max-width:980px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border); flex-shrink:0;}
.modal-head h3{font-size:16.5px;}
.modal-body{padding:20px; overflow-y:auto;}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:16px 20px; border-top:1px solid var(--border); flex-shrink:0;}

/* ===================== TOAST ===================== */
#toast-container{position:fixed; top:16px; right:16px; z-index:400; display:flex; flex-direction:column; gap:8px; max-width:320px;}
.toast{
  background:var(--card-bg); border:1px solid var(--border); border-left:4px solid var(--primary); border-radius:10px;
  padding:12px 14px; box-shadow:var(--shadow-lg); font-size:13px; font-weight:600; display:flex; gap:9px; align-items:flex-start;
  animation:toastIn .25s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
.toast.success{border-left-color:var(--success);}
.toast.error{border-left-color:var(--danger);}
.toast.warning{border-left-color:var(--warning);}
.toast .t-ic{font-size:16px;}

/* ===================== MISC ===================== */
.empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:50px 20px; text-align:center; gap:10px; color:var(--text-muted);}
.empty-state .es-ic{font-size:38px; opacity:.5;}
.empty-state h4{color:var(--text); font-size:15px;}
.progress-bar{height:8px; border-radius:6px; background:var(--bg); overflow:hidden; width:100%;}
.progress-bar > div{height:100%; border-radius:6px; background:var(--primary); transition:width .3s;}
.tag-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
.chip{padding:6px 13px; border-radius:20px; border:1px solid var(--border); background:var(--bg-elevated); font-size:12.3px; font-weight:700; cursor:pointer; color:var(--text-muted);}
.chip.active{background:var(--primary); color:#fff; border-color:var(--primary);}
.filters-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.filters-row select, .filters-row input{padding:8px 12px; border-radius:9px; border:1px solid var(--border); background:var(--card-bg); color:var(--text);}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; overflow-x:auto;}
.tab-btn{padding:10px 15px; border:none; background:none; color:var(--text-muted); font-weight:700; font-size:13px; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
.tab-btn.active{color:var(--primary); border-bottom-color:var(--primary);}
.stat-mini{display:flex; flex-direction:column; gap:2px;}
.stat-mini .v{font-size:17px; font-weight:800;}
.stat-mini .l{font-size:11px; color:var(--text-muted); font-weight:600;}
.divider{height:1px; background:var(--border); margin:16px 0;}
.link-btn{background:none; border:none; color:var(--primary); font-weight:700; cursor:pointer; font-size:13px; padding:0;}
.avatar-sm{width:30px;height:30px;border-radius:9px;background:var(--primary-soft);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;}
.icon-btn-sq{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;}
.icon-btn-sq:hover{color:var(--primary); border-color:var(--primary);}
.icon-btn-sq.danger:hover{color:var(--danger); border-color:var(--danger);}
canvas.chart-canvas{width:100%; display:block;}
.journal-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);}
.journal-item:last-child{border-bottom:none;}
.journal-dot{width:10px;height:10px;border-radius:50%;background:var(--primary); margin-top:5px; flex-shrink:0;}
.journal-photo{max-width:100%; border-radius:10px; margin-top:8px; max-height:220px; object-fit:cover;}

<script>
'use strict';
/* ============================================================
   CHANTIER MANAGER (V2)
   Les données sont persistées côté serveur (PostgreSQL) via
   l'API /api/state. Organisation du code par modules logiques.
   ============================================================ */
/* ===================== CONSTANTS ===================== */
const PROJECT_STATUSES = ['Prospect','Préparation','En cours','Suspendu','Terminé','Annulé'];
const QUOTE_STATUSES = ['Brouillon','Envoyé','Accepté','Refusé','Expiré'];

const PAYMENT_METHODS = ['Espèces','Chèque','Virement','Carte','Autre'];
const EMPLOYEE_STATUSES = ['Actif','Inactif'];
const MATERIAL_STATUSES = ['À commander','Commandé','Reçu','Utilisé'];
const SITUATION_STATUSES = ['Brouillon','Envoyée','Validée','Partiellement payée','Payée'];
const INVOICE_STATUSES = ['Brouillon','Envoyée','Payée'];
const DOCUMENT_TYPES = ['Photos','Plans','Devis','Situations','Factures','Contrats','Autres'];

const STATUS_BADGE = {
  'Prospect':'b-gray','Préparation':'b-blue','En cours':'b-blue','Suspendu':'b-orange','Terminé':'b-green','Annulé':'b-red',
  'Brouillon':'b-gray','Envoyé':'b-blue','Accepté':'b-green','Refusé':'b-red','Expiré':'b-orange',
  'À commander':'b-orange','Commandé':'b-blue','Reçu':'b-cyan','Utilisé':'b-green',
  'Envoyée':'b-blue','Validée':'b-cyan','Partiellement payée':'b-orange','Payée':'b-green',
  'Actif':'b-green','Inactif':'b-gray'
};

const NAV_ITEMS = [
  {id:'dashboard', label:'Tableau de bord', icon:'📊'},
  {id:'projects', label:'Chantiers', icon:'🏗️'},

  {id:'quotes', label:'Devis', icon:'📄', roles:['admin','comptable']},
  {id:'invoices', label:'Factures', icon:'🧾', roles:['admin','comptable']},
  {id:'expenses', label:'Dépenses', icon:'💸', roles:['admin','comptable']},
  {id:'employees', label:'Équipe', icon:'👷'},
  {id:'materials', label:'Matériaux', icon:'🧱'},
  {id:'situations', label:'Situations', icon:'📈', roles:['admin','comptable']},
  {id:'documents', label:'Documents', icon:'🗂️'},
  {id:'reports', label:'Rapports', icon:'📑', roles:['admin','comptable']},
  {id:'settings', label:'Paramètres', icon:'⚙️', roles:['admin','comptable']},
];
function visibleNavItems(){
  return NAV_ITEMS.filter(n=>!n.roles || n.roles.includes(Auth.user && Auth.user.role));
}
const BOTTOM_NAV_IDS = ['dashboard','projects','quotes','expenses','more'];

/* ===================== UTILS ===================== */
const Utils = {
  uid(prefix){ return (prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); },
  escapeHtml(str){
    if(str===null||str===undefined) return '';
    return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  },
  fmtMoney(n){
    n = Number(n); if(!isFinite(n)) n = 0;
    const symbols = {MAD:'DH', EUR:'€', USD:'$'};
    const cur = (typeof Store!=='undefined' && Store.state && Store.state.settings && Store.state.settings.currency) || 'MAD';
    const symbol = symbols[cur] || cur;
    return new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n) + ' ' + symbol;
  },
  fmtNum(n){ n=Number(n); if(!isFinite(n)) n=0; return new Intl.NumberFormat('fr-FR').format(n); },
  fmtDate(iso){
    if(!iso) return '—';
    const d = new Date(iso.length<=10 ? iso+'T00:00:00' : iso);
    if(isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('fr-FR');
  },
  fmtDateTime(iso){
    if(!iso) return '—';
    const d = new Date(iso);
    if(isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('fr-FR')+' '+d.toTimeString().slice(0,5);
  },
  todayISO(){ return new Date().toISOString().slice(0,10); },
  nowISO(){ return new Date().toISOString(); },
  daysBetween(a,b){
    const d1=new Date(a), d2=new Date(b);
    return Math.round((d2-d1)/86400000);
  },
  addDays(iso, days){
    const d = new Date((iso||Utils.todayISO()).length<=10 ? iso+'T00:00:00' : iso);
    d.setDate(d.getDate()+days);
    return d.toISOString().slice(0,10);
  },
  clamp(n,min,max){ return Math.max(min,Math.min(max,n)); },
  debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; },
  download(filename, content, mime){
    const blob = new Blob([content], {type:mime||'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url), 2000);
  },
  readFileAsDataURL(file){
    return new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload = ()=>resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  },
  async resizeImage(file, maxW){
    maxW = maxW || 900;
    const dataUrl = await Utils.readFileAsDataURL(file);
    if(!file.type.startsWith('image/')) return dataUrl;
    return new Promise((resolve)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW/w)); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.78));
      };
      img.onerror = ()=>resolve(dataUrl);
      img.src = dataUrl;
    });
  },
  badge(status){
    const cls = STATUS_BADGE[status] || 'b-gray';
    return `<span class="badge ${cls}">${Utils.escapeHtml(status)}</span>`;
  },
  optionsHtml(list, selected, placeholder){
    let html = placeholder!==undefined ? `<option value="">${Utils.escapeHtml(placeholder)}</option>` : '';
    html += list.map(v=>{
      const val = typeof v==='object' ? v.value : v;
      const label = typeof v==='object' ? v.label : v;
      return `<option value="${Utils.escapeHtml(val)}" ${String(val)===String(selected)?'selected':''}>${Utils.escapeHtml(label)}</option>`;
    }).join('');
    return html;
  },
};

/* ===================== AUTH ===================== */
const Auth = {
  user:null,
  async me(){
    const res = await fetch('/api/auth/me', {credentials:'same-origin'});
    if(!res.ok) return null;
    const json = await res.json();
    Auth.user = json.user;
    return json.user;
  },
  async login(username, password){
    const res = await fetch('/api/auth/login', {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    });
    const json = await res.json();
    if(!res.ok) throw new Error(json.error || 'Connexion impossible.');
    Auth.user = json.user;
    return json.user;
  },
  async logout(){
    await fetch('/api/auth/logout', {method:'POST', credentials:'same-origin'});
    Auth.user = null;
  },
  async changePassword(oldPassword, newPassword){
    const res = await fetch('/api/auth/change-password', {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({oldPassword, newPassword})
    });
    const json = await res.json();
    if(!res.ok) throw new Error(json.error || 'Erreur.');
    return true;
  },
  isAdmin(){ return Auth.user && Auth.user.role==='admin'; },
  isChef(){ return Auth.user && Auth.user.role==='chef_chantier'; },
  roleLabel(role){ return {admin:'Administrateur', comptable:'Comptable', chef_chantier:'Chef de chantier'}[role] || role; },
};

/* ===================== STORAGE ===================== */
/* Les données vivent désormais sur le serveur (PostgreSQL) via l'API /api/state,
   pas dans localStorage. Store.state reste la copie en mémoire utilisée pour un
   rendu instantané ; chaque mutation programme une sauvegarde réseau débouncée. */
const Storage = {
  async load(){
    const res = await fetch('/api/state', {credentials:'same-origin'});
    if(res.status===401){ const e = new Error('unauthorized'); e.authExpired = true; throw e; }
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    return json.data;
  },
  _timer:null,
  save(state){
    clearTimeout(Storage._timer);
    Storage._timer = setTimeout(()=>Storage._flush(state), 400);
  },
  async _flush(state){
    try{
      const res = await fetch('/api/state', {
        method:'PUT', credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(state)
      });
      if(res.status===401){
        UI.toast('Votre session a expiré. Veuillez vous reconnecter.', 'error');
        showLoginScreen();
        return;
      }
      if(!res.ok) throw new Error('HTTP '+res.status);
    }catch(e){
      console.error('Erreur de sauvegarde', e);
      UI.toast("Connexion au serveur perdue : vos dernières modifications n'ont peut-être pas été enregistrées.", 'error');
    }
  }
};

function defaultState(){
  return {
    settings:{
      company:{ name:'', logo:'', address:'', phone:'', email:'', ice:'', ifiscal:'' },
      tvaDefault:20, currency:'MAD', theme:'light', retenueDefault:10,
    },
    clients:[], projects:[], quotes:[], invoices:[], expenses:[], employees:[], materials:[], situations:[], documents:[], journal:[],
  };
}
function migrateState(loaded){
  const base = defaultState();
  const merged = Object.assign({}, base, loaded);
  merged.settings = Object.assign({}, base.settings, loaded.settings||{});
  merged.settings.company = Object.assign({}, base.settings.company, (loaded.settings||{}).company||{});
  Object.keys(base).forEach(k=>{ if(Array.isArray(base[k]) && !Array.isArray(merged[k])) merged[k]=[]; });
  return merged;
}

/* ===================== STORE ===================== */
const Store = {
  state:null,
  firstRun:false,
  async init(){
    const loaded = await Storage.load();
    if(loaded){ this.state = migrateState(loaded); }
    else { this.state = defaultState(); this.firstRun = true; this.persist(); }
  },
  persist(){ Storage.save(this.state); },
  all(coll){ return this.state[coll]; },
  get(coll,id){ return this.state[coll].find(x=>x.id===id) || null; },
  add(coll,item){
    item.id = item.id || Utils.uid(coll.slice(0,3));
    item.createdAt = item.createdAt || Utils.nowISO();
    this.state[coll].push(item);
    this.persist();
    return item;
  },
  update(coll,id,patch){
    const it = this.get(coll,id);
    if(!it) return null;
    Object.assign(it,patch);
    it.updatedAt = Utils.nowISO();
    this.persist();
    return it;
  },
  remove(coll,id){
    this.state[coll] = this.state[coll].filter(x=>x.id!==id);
    this.persist();
  },
  clientName(id){ const c=this.get('clients',id); return c ? (c.company ? `${c.name} (${c.company})` : c.name) : '—'; },
  projectName(id){ const p=this.get('projects',id); return p ? p.name : '—'; },
  projectsOptions(){ return this.state.projects.map(p=>({value:p.id,label:p.name})); },
  clientsOptions(){ return this.state.clients.map(c=>({value:c.id,label:c.company?`${c.name} (${c.company})`:c.name})); },
};

/* ===================== UI HELPERS ===================== */
const UI = {
  toast(msg, type){
    type = type || 'info';
    const icons = {success:'✅',error:'⛔',warning:'⚠️',info:'ℹ️'};
    const el = document.createElement('div');
    el.className = 'toast '+type;
    el.innerHTML = `<span class="t-ic">${icons[type]||icons.info}</span><span>${Utils.escapeHtml(msg)}</span>`;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(()=>{ el.style.transition='opacity .3s, transform .3s'; el.style.opacity='0'; el.style.transform='translateX(20px)'; setTimeout(()=>el.remove(),300); }, 3400);
  },
  openModal({title, bodyHtml, footHtml, wide, xwide, onOpen}){
    UI.closeModal();
    const root = document.getElementById('modal-root');
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'activeModalOverlay';
    overlay.innerHTML = `
      <div class="modal-box ${wide?'wide':''} ${xwide?'xwide':''}">
        <div class="modal-head"><h3>${Utils.escapeHtml(title)}</h3><button class="btn-icon" id="modalCloseBtn">✕</button></div>
        <div class="modal-body">${bodyHtml}</div>
        ${footHtml ? `<div class="modal-foot">${footHtml}</div>` : ''}
      </div>`;
    root.appendChild(overlay);
    overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) UI.closeModal(); });
    overlay.querySelector('#modalCloseBtn').addEventListener('click', UI.closeModal);
    requestAnimationFrame(()=>overlay.classList.add('open'));
    if(onOpen) onOpen(overlay);
    return overlay;
  },
  closeModal(){
    const overlay = document.getElementById('activeModalOverlay');
    if(!overlay) return;
    overlay.removeAttribute('id');
    overlay.classList.remove('open');
    setTimeout(()=>overlay.remove(), 200);
  },
  confirm(message, onConfirm, opts){
    opts = opts || {};
    UI.openModal({
      title: opts.title || 'Confirmation requise',
      bodyHtml: `<p style="font-size:14px;">${Utils.escapeHtml(message)}</p>`,
      footHtml: `<button class="btn btn-outline" id="cfCancel">Annuler</button><button class="btn ${opts.danger!==false?'btn-danger':''}" id="cfOk">${opts.okLabel||'Confirmer'}</button>`,
      onOpen(overlay){
        overlay.querySelector('#cfCancel').addEventListener('click', UI.closeModal);
        overlay.querySelector('#cfOk').addEventListener('click', ()=>{ UI.closeModal(); onConfirm(); });
      }
    });
  },
};
/* ===================== FORM BUILDER (generic) ===================== */
const FormBuilder = {
  fieldsHtml(fields, data){
    data = data || {};
    return fields.map(f=>{
      if(f.type==='section') return `<div class="form-section-label">${Utils.escapeHtml(f.label)}</div>`;
      const val = data[f.name] !== undefined ? data[f.name] : (f.default !== undefined ? f.default : '');
      const sizeClass = f.size==='half' ? 'half' : (f.size==='third' ? 'third' : '');
      const req = f.required ? 'required' : '';
      if(f.type==='select'){
        const opts = typeof f.options==='function' ? f.options() : f.options;
        return `<div class="form-group ${sizeClass}"><label>${Utils.escapeHtml(f.label)}${f.required?' *':''}</label>
          <select name="${f.name}" ${req}>${Utils.optionsHtml(opts, val, f.placeholder)}</select></div>`;
      }
      if(f.type==='textarea'){
        return `<div class="form-group ${sizeClass}"><label>${Utils.escapeHtml(f.label)}</label>
          <textarea name="${f.name}" rows="${f.rows||3}" placeholder="${Utils.escapeHtml(f.placeholder||'')}">${Utils.escapeHtml(val)}</textarea></div>`;
      }
      if(f.type==='checkbox'){
        return `<div class="form-group ${sizeClass}"><label>&nbsp;</label><div class="checkbox-row">
          <input type="checkbox" name="${f.name}" ${val?'checked':''}><span>${Utils.escapeHtml(f.label)}</span></div></div>`;
      }
      return `<div class="form-group ${sizeClass}"><label>${Utils.escapeHtml(f.label)}${f.required?' *':''}</label>
        <input type="${f.type||'text'}" name="${f.name}" value="${Utils.escapeHtml(val)}" ${f.step?`step="${f.step}"`:''} ${f.min!==undefined?`min="${f.min}"`:''} ${req} placeholder="${Utils.escapeHtml(f.placeholder||'')}"></div>`;
    }).join('');
  },
  readForm(formEl, fields){
    const out = {};
    fields.forEach(f=>{
      if(f.type==='section') return;
      const el = formEl.elements[f.name];
      if(!el) return;
      if(f.type==='checkbox'){ out[f.name] = el.checked; return; }
      let v = el.value;
      if(f.type==='number') v = v===''? 0 : parseFloat(v);
      out[f.name] = v;
    });
    return out;
  },
  validate(data, fields){
    for(const f of fields){
      if(f.type==='section') continue;
      if(f.required && (data[f.name]===''||data[f.name]===undefined||data[f.name]===null)){
        return `Le champ "${f.label}" est obligatoire.`;
      }
    }
    return null;
  }
};

/* ===================== GENERIC DATA TABLE ===================== */
function renderTable({columns, rows, emptyIcon, emptyTitle, emptyText, emptyAction}){
  if(!rows.length){
    return `<div class="empty-state"><div class="es-ic">${emptyIcon||'📭'}</div><h4>${emptyTitle||'Aucune donnée'}</h4><p>${emptyText||''}</p>${emptyAction||''}</div>`;
  }
  const thead = `<thead><tr>${columns.map(c=>`<th class="${c.num?'num':''}">${c.label}</th>`).join('')}</tr></thead>`;
  const tbody = `<tbody>${rows.map(r=>`<tr>${columns.map(c=>`<td class="${c.num?'num':''} ${c.actions?'row-actions-cell':''}" data-label="${c.label}">${c.render(r)}</td>`).join('')}</tr>`).join('')}</tbody>`;
  return `<div class="table-responsive"><table>${thead}${tbody}</table></div>`;
}

/* ===================== PAGINATION ===================== */
const PAGE_SIZE = 10;
const Pager = {
  slice(state, list){
    state.page = state.page || 1;
    const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if(state.page > totalPages) state.page = totalPages;
    if(state.page < 1) state.page = 1;
    const start = (state.page-1)*PAGE_SIZE;
    return { items: list.slice(start, start+PAGE_SIZE), totalPages, total: list.length };
  },
  html(state, totalPages, total){
    if(total<=0 || totalPages<=1) return '';
    return `<div class="pager">
      <span class="pager-info">${total} résultat(s) · page ${state.page}/${totalPages}</span>
      <div class="pager-btns">
        <button type="button" class="pager-btn" data-pager="prev" ${state.page<=1?'disabled':''} title="Page précédente">‹</button>
        <button type="button" class="pager-btn" data-pager="next" ${state.page>=totalPages?'disabled':''} title="Page suivante">›</button>
      </div>
    </div>`;
  },
  wire(state, totalPages){
    document.querySelectorAll('[data-pager]').forEach(btn=>btn.addEventListener('click', ()=>{
      if(btn.dataset.pager==='prev') state.page = Math.max(1, state.page-1);
      else state.page = Math.min(totalPages, state.page+1);
      renderView();
    }));
  }
};

function runGlobalSearch(q){
  const box = document.getElementById('searchResults');
  q = q.trim().toLowerCase();
  if(!q){ box.classList.add('hidden'); box.innerHTML=''; return; }
  const results = [];
  Store.all('projects').forEach(p=>{ if(p.name.toLowerCase().includes(q)||((p.city||'').toLowerCase().includes(q))) results.push({type:'Chantier', label:p.name, sub:p.city||'', go:()=>Router.navigate('projects', p.id)}); });
  Store.all('clients').forEach(c=>{ if(c.name.toLowerCase().includes(q)||(c.company||'').toLowerCase().includes(q)) results.push({type:'Client', label:c.name, sub:c.company||'', go:()=>Router.navigate('clients')}); });
  Store.all('quotes').forEach(qt=>{ if((qt.number||'').toLowerCase().includes(q)||(qt.object||'').toLowerCase().includes(q)) results.push({type:'Devis', label:qt.number, sub:qt.object||'', go:()=>Router.navigate('quotes')}); });
  Store.all('invoices').forEach(inv=>{ if((inv.number||'').toLowerCase().includes(q)||(inv.object||'').toLowerCase().includes(q)) results.push({type:'Facture', label:inv.number, sub:inv.object||'', go:()=>Router.navigate('invoices')}); });
  Store.all('expenses').forEach(e=>{ if((e.description||'').toLowerCase().includes(q)||(e.supplier||'').toLowerCase().includes(q)) results.push({type:'Dépense', label:e.description||e.category, sub:Utils.fmtMoney(e.amountTTC), go:()=>Router.navigate('expenses')}); });
  Store.all('situations').forEach(s=>{ if((s.number||'').toLowerCase().includes(q)) results.push({type:'Situation', label:s.number, sub:Store.projectName(s.projectId), go:()=>Router.navigate('situations')}); });
  Store.all('employees').forEach(e=>{ if(e.name.toLowerCase().includes(q)) results.push({type:'Employé', label:e.name, sub:e.role||'', go:()=>Router.navigate('employees')}); });
  Store.all('materials').forEach(m=>{ if(m.name.toLowerCase().includes(q)) results.push({type:'Matériau', label:m.name, sub:m.supplier||'', go:()=>Router.navigate('materials')}); });

  if(!results.length){ box.innerHTML = `<div class="sr-empty">Aucun résultat pour "${Utils.escapeHtml(q)}"</div>`; }
  else{
    box.innerHTML = results.slice(0,20).map((r,i)=>`<div class="sr-item" data-i="${i}"><b>${Utils.escapeHtml(r.label)}</b> — ${r.type}<small>${Utils.escapeHtml(r.sub)}</small></div>`).join('');
    box.querySelectorAll('.sr-item').forEach((el,i)=>el.addEventListener('click', ()=>{ results[i].go(); box.classList.add('hidden'); }));
  }
  box.classList.remove('hidden');
}
/* ===================== MINI CHART (canvas, no dependency) ===================== */
const Chart = {
  drawGroupedBars(canvas, labels, series){
    if(!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const cssW = canvas.clientWidth || 600, cssH = canvas.clientHeight || 240;
    canvas.width = cssW*dpr; canvas.height = cssH*dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);
    const isDark = document.documentElement.getAttribute('data-theme')==='dark';
    const textColor = isDark ? '#9aa4bd' : '#66708a';
    const gridColor = isDark ? '#28324a' : '#e3e7ee';
    const padL=52, padB=28, padT=16, padR=10;
    const chartW = cssW-padL-padR, chartH = cssH-padT-padB;
    let maxVal = 1;
    series.forEach(s=>s.values.forEach(v=>{ if(v>maxVal) maxVal=v; }));
    maxVal = maxVal * 1.15;
    // grid lines + y labels
    ctx.strokeStyle = gridColor; ctx.fillStyle = textColor; ctx.font='10px sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle';
    const steps=4;
    for(let i=0;i<=steps;i++){
      const y = padT + chartH - (chartH*i/steps);
      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(cssW-padR,y); ctx.stroke();
      const val = (maxVal*i/steps);
      ctx.fillText(val>=1000? Math.round(val/1000)+'k' : Math.round(val), padL-8, y);
    }
    const groupW = chartW/labels.length;
    const barW = Math.min(16, (groupW*0.6)/series.length);
    labels.forEach((lab,gi)=>{
      const groupX = padL + gi*groupW + groupW/2;
      series.forEach((s,si)=>{
        const v = s.values[gi]||0;
        const h = chartH * (v/maxVal);
        const x = groupX - (series.length*barW)/2 + si*barW;
        const y = padT+chartH-h;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        if(ctx.roundRect) ctx.roundRect(x,y,barW-3,h,3); else ctx.rect(x,y,barW-3,h);
        ctx.fill();
      });
      ctx.fillStyle = textColor; ctx.textAlign='center'; ctx.font='10.5px sans-serif';
      ctx.fillText(lab, groupX, padT+chartH+16);
    });
  },
  drawDonut(canvas, segments){
    if(!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const cssW = canvas.clientWidth||220, cssH = canvas.clientHeight||220;
    canvas.width=cssW*dpr; canvas.height=cssH*dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);
    const total = segments.reduce((s,x)=>s+x.value,0) || 1;
    const cx=cssW/2, cy=cssH/2, r=Math.min(cx,cy)-6, rw=Math.max(14,r*0.35);
    let start=-Math.PI/2;
    segments.forEach(seg=>{
      const angle = (seg.value/total)*Math.PI*2;
      ctx.beginPath();
      ctx.arc(cx,cy,r,start,start+angle);
      ctx.strokeStyle = seg.color; ctx.lineWidth = rw; ctx.lineCap='butt';
      ctx.stroke();
      start += angle;
    });
  }
};

/* ===================== PDF EXPORT (jsPDF, vendored locally — works offline) ===================== */
const Pdf = {
  MX: 14, PW: 210, PH: 297,
  ensure(){
    if(!window.jspdf || !window.jspdf.jsPDF){
      UI.toast("Le module d'export PDF n'a pas pu être chargé (fichier vendor/jspdf.umd.min.js manquant).", 'error');
      return null;
    }
    return window.jspdf.jsPDF;
  },
  header(doc, company, title, metaLines){
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(20);
    doc.text(company.name || 'Mon Entreprise', Pdf.MX, 18);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(100);
    let y = 24;
    [
      company.address,
      [company.phone, company.email].filter(Boolean).join('  ·  '),
      [company.ice?('ICE: '+company.ice):'', company.ifiscal?('IF: '+company.ifiscal):''].filter(Boolean).join('  ·  '),
    ].filter(Boolean).forEach(line=>{ doc.text(String(line), Pdf.MX, y); y += 4.5; });

    doc.setTextColor(20); doc.setFont('helvetica','bold'); doc.setFontSize(17);
    doc.text(title, Pdf.PW-Pdf.MX, 18, {align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(70);
    let ry = 25;
    (metaLines||[]).filter(Boolean).forEach(line=>{ doc.text(String(line), Pdf.PW-Pdf.MX, ry, {align:'right'}); ry += 4.5; });

    doc.setTextColor(20);
    doc.setDrawColor(215); doc.setLineWidth(0.4);
    doc.line(Pdf.MX, 40, Pdf.PW-Pdf.MX, 40);
    return 46;
  },
  infoBlock(doc, y, label, lines){
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(110);
    doc.text(label, Pdf.MX, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(20);
    let ly = y + 5;
    (lines||[]).filter(Boolean).forEach(line=>{ doc.text(String(line), Pdf.MX, ly); ly += 5; });
    return ly + 3;
  },
  table(doc, startY, columns, rows){
    const marginBottom = 25;
    const tableW = (Pdf.PW - Pdf.MX*2);
    let y = startY;
    const drawHeader = ()=>{
      doc.setFillColor(240,242,247);
      doc.rect(Pdf.MX, y, tableW, 8, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(70);
      let x = Pdf.MX;
      columns.forEach(c=>{ doc.text(c.header, x + (c.align==='right'? c.width-2 : 2), y+5.5, {align: c.align==='right'?'right':'left'}); x += c.width; });
      y += 8;
      doc.setTextColor(20); doc.setFont('helvetica','normal'); doc.setFontSize(9);
    };
    drawHeader();
    rows.forEach((row, idx)=>{
      const cellTexts = columns.map(c=>String(c.render(row)));
      const wrapped = cellTexts.map((t,i)=>doc.splitTextToSize(t, columns[i].width-4));
      const lineCount = Math.max(1, ...wrapped.map(w=>w.length));
      const rowH = Math.max(7, lineCount*4.6+2.4);
      if(y + rowH > Pdf.PH - marginBottom){ doc.addPage(); y = 20; drawHeader(); }
      if(idx%2===1){ doc.setFillColor(250,250,252); doc.rect(Pdf.MX, y, tableW, rowH, 'F'); }
      let x = Pdf.MX;
      columns.forEach((c,i)=>{
        wrapped[i].forEach((line, li)=>{
          doc.text(line, x + (c.align==='right'? c.width-2 : 2), y+5+li*4.6, {align: c.align==='right'?'right':'left'});
        });
        x += c.width;
      });
      doc.setDrawColor(230); doc.setLineWidth(0.2);
      doc.line(Pdf.MX, y+rowH, Pdf.MX+tableW, y+rowH);
      y += rowH;
    });
    return y + 4;
  },
  totalsBlock(doc, y, lines){
    const boxW = 76, x0 = Pdf.PW-Pdf.MX-boxW;
    let cy = y;
    (lines||[]).forEach(l=>{
      if(l.strong){ doc.setDrawColor(30); doc.setLineWidth(0.5); doc.line(x0, cy, Pdf.PW-Pdf.MX, cy); cy += 5.5; doc.setFont('helvetica','bold'); doc.setFontSize(11); }
      else { doc.setFont('helvetica','normal'); doc.setFontSize(9.5); }
      doc.text(l.label, x0, cy);
      doc.text(String(l.value), Pdf.PW-Pdf.MX, cy, {align:'right'});
      cy += l.strong? 7 : 5.5;
    });
    return cy;
  },
  footer(doc, text){
    const pages = doc.getNumberOfPages();
    for(let i=1;i<=pages;i++){
      doc.setPage(i);
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(140);
      doc.text(text, Pdf.MX, Pdf.PH-7);
      doc.text(`Page ${i}/${pages}`, Pdf.PW-Pdf.MX, Pdf.PH-7, {align:'right'});
    }
  }
};

function projectExpensesHT(projectId){

function computeAlerts(){
  const alerts = [];
  const today = Utils.todayISO();
  Store.all('projects').forEach(p=>{
    if(['Terminé','Annulé'].includes(p.status)) return;
    const dep = projectExpenses(p.id);
    if(p.budgetTTC && dep > p.budgetTTC){
      alerts.push({icon:'⚠️', color:'danger', title:'Budget dépassé', sub:`${p.name} : dépenses ${Utils.fmtMoney(dep)} > budget ${Utils.fmtMoney(p.budgetTTC)}`});
    }
    if(p.endDate){
      const days = Utils.daysBetween(today, p.endDate);
      if(days>=0 && days<=7) alerts.push({icon:'⏰', color:'warning', title:'Échéance proche', sub:`${p.name} : fin prévue dans ${days} jour(s)`});
      if(days<0) alerts.push({icon:'⏰', color:'danger', title:'Échéance dépassée', sub:`${p.name} : date de fin dépassée de ${-days} jour(s)`});
    }
    const lastJournal = Store.all('journal').filter(j=>j.projectId===p.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
    if(p.status==='En cours'){
      const lastDate = lastJournal ? lastJournal.date : (p.startDate||null);
      if(lastDate && Utils.daysBetween(lastDate, today) > 14){
        alerts.push({icon:'💤', color:'warning', title:'Chantier sans activité récente', sub:`${p.name} : aucune activité au journal depuis plus de 14 jours`});
      }
    }
  });
  Store.all('situations').forEach(s=>{
    const reste = situationReste(s);
    if(reste>0 && s.status!=='Payée'){
      const days = Utils.daysBetween(situationDueDate(s), today);
      if(days>0) alerts.push({icon:'💰', color:'danger', title:'Paiement en retard', sub:`Situation ${s.number} (${Store.projectName(s.projectId)}) : ${Utils.fmtMoney(reste)} en retard de ${days} jour(s)`});
    }
  });
  Store.all('invoices').forEach(inv=>{
    const reste = invoiceReste(inv);
    if(reste>0 && inv.status!=='Payée'){
      const days = Utils.daysBetween(invoiceDueDate(inv), today);
      if(days>0) alerts.push({icon:'🧾', color:'danger', title:'Facture en retard', sub:`Facture ${inv.number} (${Store.projectName(inv.projectId)}) : ${Utils.fmtMoney(reste)} en retard de ${days} jour(s)`});
    }
  });
  Store.all('materials').forEach(m=>{
    if(m.status==='À commander'){
      alerts.push({icon:'🧱', color:'warning', title:'Matériau manquant', sub:`${m.name} à commander pour ${Store.projectName(m.projectId)}`});
    }
  });
  return alerts;
}

function treasuryData(){
  const today = Utils.todayISO();
  const fromSituations = Store.all('situations')
    .filter(s=>s.status!=='Payée' && situationReste(s)>0)
    .map(s=>{
      const p = Store.get('projects', s.projectId);
      return { kind:'situation', number:s.number, projectId:s.projectId, clientId:p?p.clientId:null, due:situationDueDate(s), reste:situationReste(s) };
    });
  const fromInvoices = Store.all('invoices')
    .filter(inv=>inv.status!=='Payée' && invoiceReste(inv)>0)
    .map(inv=>({ kind:'invoice', number:inv.number, projectId:inv.projectId, clientId:inv.clientId, due:invoiceDueDate(inv), reste:invoiceReste(inv) }));
  const unpaid = fromSituations.concat(fromInvoices)
    .map(x=>{ x.days = Utils.daysBetween(x.due, today); return x; }) // >0 = en retard, <=0 = à venir dans -days jours
    .sort((a,b)=>a.due.localeCompare(b.due));
  const late = unpaid.filter(x=>x.days>0);
  const upcoming7 = unpaid.filter(x=>x.days<=0 && x.days>=-7);
  return {
    unpaid, late, upcoming7,
    totalReste: unpaid.reduce((s,x)=>s+x.reste,0),
    totalLate: late.reduce((s,x)=>s+x.reste,0),
    totalUpcoming7: upcoming7.reduce((s,x)=>s+x.reste,0),
  };
}
function treasuryForecast(unpaid){
  const months = [];
  for(let i=0;i<3;i++){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()+i);
    months.push({ key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), label:d.toLocaleDateString('fr-FR',{month:'short',year:'2-digit'}) });
  }
  const overdue = unpaid.filter(x=>x.days>0).reduce((s,x)=>s+x.reste,0);
  const values = months.map(m=>unpaid.filter(x=>x.days<=0 && x.due.startsWith(m.key)).reduce((s,x)=>s+x.reste,0));
  return { labels:['En retard', ...months.map(m=>m.label)], values:[overdue, ...values] };
}

/* ===================== PROJECT TAB EVENTS ===================== */
function bindProjectTabEvents(projectId, tab){
  if(tab==='overview'){
    const range = document.getElementById('progressRange');
    if(range){
      range.addEventListener('input', ()=>{ document.getElementById('progressVal').textContent = range.value+'%'; });
      range.addEventListener('change', ()=>{ Store.update('projects', projectId, {progress: Utils.clamp(parseInt(range.value,10),0,100)}); UI.toast('Avancement mis à jour.','success'); renderNav(); });
    }
  }
  if(tab==='expenses'){
    const add = document.getElementById('tabAddExpense'); if(add) add.addEventListener('click', ()=>Expenses.openForm(null, projectId, ()=>Projects.renderTab(projectId)));
    document.querySelectorAll('[data-edit-exp]').forEach(el=>el.addEventListener('click', ()=>Expenses.openForm(el.dataset.editExp, projectId, ()=>Projects.renderTab(projectId))));
    document.querySelectorAll('[data-del-exp]').forEach(el=>el.addEventListener('click', ()=>Expenses.remove(el.dataset.delExp, ()=>Projects.renderTab(projectId))));
  }
  if(tab==='materials'){
    const add = document.getElementById('tabAddMaterial'); if(add) add.addEventListener('click', ()=>Materials.openForm(null, projectId, ()=>Projects.renderTab(projectId)));
    document.querySelectorAll('[data-edit-mat]').forEach(el=>el.addEventListener('click', ()=>Materials.openForm(el.dataset.editMat, projectId, ()=>Projects.renderTab(projectId))));
    document.querySelectorAll('[data-del-mat]').forEach(el=>el.addEventListener('click', ()=>Materials.remove(el.dataset.delMat, ()=>Projects.renderTab(projectId))));
  }
  if(tab==='labor'){
    const add = document.getElementById('tabAddEmployee'); if(add) add.addEventListener('click', ()=>Employees.openForm(null, projectId, ()=>Projects.renderTab(projectId)));
  }
  if(tab==='situations'){
    const add = document.getElementById('tabAddSituation'); if(add) add.addEventListener('click', ()=>Situations.openForm(null, projectId, ()=>Projects.renderTab(projectId)));
    document.querySelectorAll('[data-view-sit]').forEach(el=>el.addEventListener('click', ()=>Situations.openView(el.dataset.viewSit)));
  }
  if(tab==='documents'){
    const add = document.getElementById('tabAddDocument'); if(add) add.addEventListener('click', ()=>Documents.openForm(projectId, ()=>Projects.renderTab(projectId)));
    document.querySelectorAll('[data-del-doc]').forEach(el=>el.addEventListener('click', ()=>Documents.remove(el.dataset.delDoc, ()=>Projects.renderTab(projectId))));
  }
  if(tab==='journal'){
    const add = document.getElementById('tabAddJournal'); if(add) add.addEventListener('click', ()=>Projects.openJournalForm(projectId));
  }
}
Projects.openJournalForm = function(projectId){
  UI.openModal({
    title:'Nouvelle entrée de journal',
    bodyHtml:`<form id="journalForm"><div class="form-grid">
      <div class="form-group half"><label>Date *</label><input type="date" name="date" value="${Utils.todayISO()}" required></div>
      <div class="form-group half"><label>Heure</label><input type="time" name="time"></div>
      <div class="form-group"><label>Événement</label><input type="text" name="event" placeholder="Ex: Coulage dalle, Livraison ciment..."></div>
      <div class="form-group"><label>Note</label><textarea name="note" rows="3" placeholder="Détails..."></textarea></div>
      <div class="form-group"><label>Photo (optionnel)</label><input type="file" name="photo" accept="image/*"></div>
    </div></form>`,
    footHtml:`<button class="btn btn-outline" id="cancelJournal">Annuler</button><button class="btn" id="saveJournal">Ajouter</button>`,
    onOpen(overlay){
      overlay.querySelector('#cancelJournal').addEventListener('click', UI.closeModal);
      overlay.querySelector('#saveJournal').addEventListener('click', async ()=>{
        const form = overlay.querySelector('#journalForm');
        const fd = new FormData(form);
        const date = fd.get('date'); if(!date){ UI.toast('La date est obligatoire.','error'); return; }
        let photoDataUrl = null;
        const file = form.elements['photo'].files[0];
        if(file){ try{ photoDataUrl = await Utils.resizeImage(file, 900); }catch(e){} }
        Store.add('journal', {projectId, date, time:fd.get('time')||'', event:fd.get('event')||'', note:fd.get('note')||'', photoDataUrl});
        UI.closeModal(); UI.toast('Entrée ajoutée au journal.','success');
        Projects.renderTab(projectId);
      });
    }
  });
};

function clientProjectCount(clientId){ return Store.all('projects').filter(p=>p.clientId===clientId).length; }
function clientRevenue(clientId){ return Store.all('projects').filter(p=>p.clientId===clientId).reduce((s,p)=>s+(Number(p.budgetHT)||0),0); }
function clientEncaisse(clientId){
  const projIds = Store.all('projects').filter(p=>p.clientId===clientId).map(p=>p.id);
  return Store.all('situations').filter(s=>projIds.includes(s.projectId)).reduce((s,st)=>s+(Number(st.paid)||0),0);
}
function clientReste(clientId){ return clientRevenue(clientId) - clientEncaisse(clientId); }

function employeeCost(emp){
  return (emp.attendance||[]).reduce((s,a)=> s + (a.type==='present' ? (Number(emp.dailyRate)||0) * ((a.hours||8)/8) : 0), 0);
}
/* ===================== QUOTES ===================== */
const Quotes = {
  filter:{q:'', status:'', page:1},
  editLines:[],
  async nextNumber(){
    const res = await fetch('/api/next-number?type=quote', {credentials:'same-origin'});
    const json = await res.json();
    if(!res.ok) throw new Error(json.error||'Erreur de numérotation');
    return json.number;
  },
  computeTotals(lines, tva){
    const totalHT = lines.reduce((s,l)=> s + (Number(l.qty)||0)*(Number(l.priceHT)||0)*(1-(Number(l.discount)||0)/100), 0);
    const tvaAmount = totalHT * (Number(tva)||0)/100;
    return {totalHT: Math.round(totalHT*100)/100, tvaAmount: Math.round(tvaAmount*100)/100, totalTTC: Math.round((totalHT+tvaAmount)*100)/100};
  },
  render(){
    const list = Store.all('quotes').filter(q=>{
      if(Quotes.filter.status && q.status!==Quotes.filter.status) return false;
      if(Quotes.filter.q){ const s=Quotes.filter.q.toLowerCase(); if(!((q.number||'').toLowerCase().includes(s)||(q.object||'').toLowerCase().includes(s))) return false; }
      return true;
    }).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
    const pg = Pager.slice(Quotes.filter, list);

    const html = `
      <div class="view-head">
        <div><h2>Devis</h2><div class="sub">${Store.all('quotes').length} devis</div></div>
        <div class="view-actions"><button class="btn" id="btnNewQuote">+ Nouveau devis</button></div>
      </div>
      <div class="filters-row">
        <input type="text" id="quoteSearch" placeholder="Rechercher..." value="${Utils.escapeHtml(Quotes.filter.q)}">
        <select id="quoteStatusFilter">${Utils.optionsHtml(QUOTE_STATUSES, Quotes.filter.status, 'Tous les statuts')}</select>
      </div>
      <div class="card">
        ${renderTable({columns:[
          {label:'N°', render:q=>`<b>${Utils.escapeHtml(q.number)}</b>`},
          {label:'Date', render:q=>Utils.fmtDate(q.date)},
          {label:'Client', render:q=>Utils.escapeHtml(Store.clientName(q.clientId))},
          {label:'Objet', render:q=>Utils.escapeHtml(q.object||'—')},
          {label:'Total TTC', num:true, render:q=>Utils.fmtMoney(q.totalTTC)},
          {label:'Statut', render:q=>Utils.badge(q.status)},
          {label:'', actions:true, render:q=>`<div class="row-actions">
            ${!['Accepté','Refusé'].includes(q.status)?`<button class="icon-btn-sq" data-accept-quote="${q.id}" title="Marquer accepté" style="color:var(--success);">✔️</button><button class="icon-btn-sq" data-refuse-quote="${q.id}" title="Marquer refusé" style="color:var(--danger);">✖️</button>`:''}
            ${q.status==='Accepté'?`<button class="icon-btn-sq" data-to-invoice="${q.id}" title="Convertir en facture" style="color:var(--primary);">🧾</button>`:''}
            <button class="icon-btn-sq" data-view-quote="${q.id}" title="Voir/Imprimer">🖨️</button>
            <button class="icon-btn-sq" data-pdf-quote="${q.id}" title="Télécharger PDF">⬇️</button>
            <button class="icon-btn-sq" data-edit-quote="${q.id}" title="Modifier">✏️</button>
            <button class="icon-btn-sq" data-dup-quote="${q.id}" title="Dupliquer">📋</button>
            <button class="icon-btn-sq danger" data-del-quote="${q.id}" title="Supprimer">🗑️</button>
          </div>`},
        ], rows:pg.items, emptyIcon:'📄', emptyTitle:'Aucun devis', emptyText:'Créez votre premier devis.'})}
        ${Pager.html(Quotes.filter, pg.totalPages, pg.total)}
      </div>
    `;
    setTimeout(()=>{
      document.getElementById('btnNewQuote').addEventListener('click', ()=>Quotes.openForm());
      document.getElementById('quoteSearch').addEventListener('input', Utils.debounce(e=>{ Quotes.filter.q=e.target.value; Quotes.filter.page=1; renderView(); document.getElementById('quoteSearch').focus(); },250));
      document.getElementById('quoteStatusFilter').addEventListener('change', e=>{ Quotes.filter.status=e.target.value; Quotes.filter.page=1; renderView(); });
      document.querySelectorAll('[data-edit-quote]').forEach(el=>el.addEventListener('click', ()=>Quotes.openForm(el.dataset.editQuote)));
      document.querySelectorAll('[data-view-quote]').forEach(el=>el.addEventListener('click', ()=>Quotes.print(el.dataset.viewQuote)));
      document.querySelectorAll('[data-pdf-quote]').forEach(el=>el.addEventListener('click', ()=>Quotes.downloadPdf(el.dataset.pdfQuote)));
      document.querySelectorAll('[data-dup-quote]').forEach(el=>el.addEventListener('click', ()=>Quotes.duplicate(el.dataset.dupQuote)));
      document.querySelectorAll('[data-del-quote]').forEach(el=>el.addEventListener('click', ()=>Quotes.remove(el.dataset.delQuote)));
      document.querySelectorAll('[data-accept-quote]').forEach(el=>el.addEventListener('click', ()=>Quotes.setStatus(el.dataset.acceptQuote,'Accepté')));
      document.querySelectorAll('[data-refuse-quote]').forEach(el=>el.addEventListener('click', ()=>Quotes.setStatus(el.dataset.refuseQuote,'Refusé')));
      document.querySelectorAll('[data-to-invoice]').forEach(el=>el.addEventListener('click', ()=>Invoices.createFromQuote(el.dataset.toInvoice)));
      Pager.wire(Quotes.filter, pg.totalPages);
    },0);
    return html;
  },
  async openForm(id){
    const editing = id ? Store.get('quotes', id) : null;
    Quotes.editLines = editing ? JSON.parse(JSON.stringify(editing.lines||[])) : [{designation:'', unit:'u', qty:1, priceHT:0, discount:0}];
    let number = editing ? editing.number : null;
    if(!editing){
      try{ number = await Quotes.nextNumber(); }
      catch(e){ UI.toast(e.message,'error'); return; }
    }
    const d = editing || {number, date:Utils.todayISO(), validity:'30', tva:Store.state.settings.tvaDefault||20, status:'Brouillon'};
    UI.openModal({
      title: editing ? 'Modifier le devis' : 'Nouveau devis', xwide:true,
      bodyHtml:`
        <form id="quoteForm">
          <div class="form-grid">
            <div class="form-group third"><label>N° devis</label><input type="text" name="number" value="${Utils.escapeHtml(d.number)}" required></div>
            <div class="form-group third"><label>Date</label><input type="date" name="date" value="${Utils.escapeHtml(d.date)}"></div>
            <div class="form-group third"><label>Validité (jours)</label><input type="number" name="validity" value="${Utils.escapeHtml(d.validity||30)}"></div>
            <div class="form-group half"><label>Client *</label><select name="clientId" required>${Utils.optionsHtml(Store.clientsOptions(), d.clientId, '— Sélectionner —')}</select></div>
            <div class="form-group half"><label>Chantier</label><select name="projectId">${Utils.optionsHtml(Store.projectsOptions(), d.projectId, '— Aucun —')}</select></div>
            <div class="form-group"><label>Objet</label><input type="text" name="object" value="${Utils.escapeHtml(d.object||'')}" placeholder="Ex: Travaux de gros œuvre..."></div>
          </div>
          <div class="divider"></div>
          <div class="card-head"><div class="section-title">Lignes du devis</div><button type="button" class="btn btn-sm" id="addLine">+ Ligne</button></div>
          <div class="table-responsive"><table id="linesTable"><thead><tr><th>Désignation</th><th>Unité</th><th class="num">Qté</th><th class="num">P.U. HT</th><th class="num">Remise %</th><th class="num">Total HT</th><th></th></tr></thead><tbody id="linesBody"></tbody></table></div>
          <div class="divider"></div>
          <div style="display:flex;justify-content:flex-end;gap:20px;align-items:center;flex-wrap:wrap;">
            <div class="form-group" style="max-width:140px;"><label>TVA (%)</label><input type="number" name="tva" id="quoteTva" value="${d.tva}" step="0.01"></div>
            <div class="form-group" style="max-width:180px;"><label>Statut</label><select name="status">${Utils.optionsHtml(QUOTE_STATUSES, d.status)}</select></div>
          </div>
          <div class="totals" style="margin-left:auto;max-width:280px;">
            <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>Total HT</span><b id="sumHT">0,00 DH</b></div>
            <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>TVA</span><b id="sumTVA">0,00 DH</b></div>
            <div style="display:flex;justify-content:space-between;padding:8px 0;border-top:2px solid var(--border);font-size:16px;"><span>Total TTC</span><b id="sumTTC">0,00 DH</b></div>
          </div>
        </form>`,
      footHtml:`<button class="btn btn-outline" id="cancelQuote">Annuler</button><button class="btn" id="saveQuote">Enregistrer</button>`,
      onOpen(overlay){
        function renderLines(){
          overlay.querySelector('#linesBody').innerHTML = Quotes.editLines.map((l,i)=>`
            <tr>
              <td><input type="text" data-li="${i}" data-f="designation" value="${Utils.escapeHtml(l.designation)}" style="min-width:160px;"></td>
              <td><input type="text" data-li="${i}" data-f="unit" value="${Utils.escapeHtml(l.unit)}" style="width:70px;"></td>
              <td class="num"><input type="number" data-li="${i}" data-f="qty" value="${l.qty}" step="0.01" style="width:80px;text-align:right;"></td>
              <td class="num"><input type="number" data-li="${i}" data-f="priceHT" value="${l.priceHT}" step="0.01" style="width:100px;text-align:right;"></td>
              <td class="num"><input type="number" data-li="${i}" data-f="discount" value="${l.discount||0}" step="0.01" style="width:80px;text-align:right;"></td>
              <td class="num" style="white-space:nowrap;" data-total="${i}">${Utils.fmtMoney((l.qty||0)*(l.priceHT||0)*(1-(l.discount||0)/100))}</td>
              <td><button type="button" class="icon-btn-sq danger" data-rmline="${i}">✕</button></td>
            </tr>`).join('');
          overlay.querySelectorAll('[data-li]').forEach(inp=>inp.addEventListener('input', ()=>{
            const i = +inp.dataset.li, f = inp.dataset.f;
            Quotes.editLines[i][f] = (f==='designation'||f==='unit') ? inp.value : parseFloat(inp.value)||0;
            recalc();
            if(f!=='designation' && f!=='unit'){
              const l2 = Quotes.editLines[i];
              overlay.querySelector(`[data-total="${i}"]`).textContent = Utils.fmtMoney((l2.qty||0)*(l2.priceHT||0)*(1-(l2.discount||0)/100));
            }
          }));
          overlay.querySelectorAll('[data-rmline]').forEach(btn=>btn.addEventListener('click', ()=>{
            Quotes.editLines.splice(+btn.dataset.rmline,1); renderLines(); recalc();
          }));
        }
        function recalc(){
          const tva = parseFloat(overlay.querySelector('#quoteTva').value)||0;
          const t = Quotes.computeTotals(Quotes.editLines, tva);
          overlay.querySelector('#sumHT').textContent = Utils.fmtMoney(t.totalHT);
          overlay.querySelector('#sumTVA').textContent = Utils.fmtMoney(t.tvaAmount);
          overlay.querySelector('#sumTTC').textContent = Utils.fmtMoney(t.totalTTC);
        }
        renderLines(); recalc();
        overlay.querySelector('#addLine').addEventListener('click', ()=>{ Quotes.editLines.push({designation:'',unit:'u',qty:1,priceHT:0,discount:0}); renderLines(); recalc(); });
        overlay.querySelector('#quoteTva').addEventListener('input', recalc);
        overlay.querySelector('#cancelQuote').addEventListener('click', UI.closeModal);
        overlay.querySelector('#saveQuote').addEventListener('click', ()=>{
          const form = overlay.querySelector('#quoteForm');
          const fd = new FormData(form);
          if(!fd.get('clientId')){ UI.toast('Le client est obligatoire.','error'); return; }
          if(!Quotes.editLines.length || Quotes.editLines.every(l=>!l.designation.trim())){ UI.toast('Ajoutez au moins une ligne au devis.','error'); return; }
          const tva = parseFloat(fd.get('tva'))||0;
          const totals = Quotes.computeTotals(Quotes.editLines, tva);
          const data = {
            number:fd.get('number'), date:fd.get('date'), validity:fd.get('validity'), clientId:fd.get('clientId'),
            projectId:fd.get('projectId')||null, object:fd.get('object'), tva, status:fd.get('status'),
            lines: JSON.parse(JSON.stringify(Quotes.editLines)), totalHT:totals.totalHT, tvaAmount:totals.tvaAmount, totalTTC:totals.totalTTC,
          };
          if(editing) Store.update('quotes', id, data); else Store.add('quotes', data);
          UI.closeModal(); UI.toast(editing?'Devis mis à jour.':'Devis créé.', 'success');
          renderView(); renderNav();
        });
      }
    });
  },
  async duplicate(id){
    const q = Store.get('quotes', id);
    const copy = JSON.parse(JSON.stringify(q));
    delete copy.id; delete copy.createdAt;
    try{ copy.number = await Quotes.nextNumber(); }
    catch(e){ UI.toast(e.message,'error'); return; }
    copy.status='Brouillon'; copy.date = Utils.todayISO();
    Store.add('quotes', copy);
    UI.toast('Devis dupliqué.', 'success');
    renderView();
  },
  remove(id){
    UI.confirm('Supprimer ce devis ?', ()=>{ Store.remove('quotes', id); UI.toast('Devis supprimé.','success'); renderView(); });
  },
  setStatus(id, status){
    Store.update('quotes', id, {status});
    UI.toast('Statut du devis mis à jour.', 'success');
    renderView();
  },
  print(id){

            <div>${Utils.escapeHtml(company.phone||'')} ${company.email?(' · '+Utils.escapeHtml(company.email)):''}</div>
            <div>${company.ice?('ICE: '+Utils.escapeHtml(company.ice)):''} ${company.ifiscal?(' · IF: '+Utils.escapeHtml(company.ifiscal)):''}</div>

/* ===================== SITUATIONS DE TRAVAUX ===================== */
function situationDueDate(s){
  return s.dueDate || Utils.addDays((s.createdAt||Utils.todayISO()).slice(0,10), 30);
}
function situationReste(s){
  return Math.max(0, Math.round(((Number(s.amountTTC)||0) - (Number(s.paid)||0))*100)/100);
}
const Situations = {
  filter:{q:'', projectId:'', status:'', page:1},
  nextNumber(projectId){
    const n = Store.all('situations').filter(s=>s.projectId===projectId).length + 1;
    return 'SIT-'+String(n).padStart(3,'0');
  },
  compute(amountHT, retenuePct, tva, paid){
    amountHT = Number(amountHT)||0; retenuePct = Number(retenuePct)||0; tva = Number(tva)||0; paid = Number(paid)||0;
    const retenue = Math.round(amountHT*retenuePct/100*100)/100;
    const baseTVA = amountHT - retenue;
    const tvaAmount = Math.round(baseTVA*tva/100*100)/100;
    const amountTTC = Math.round((baseTVA+tvaAmount)*100)/100;
    return {retenue, tvaAmount, amountTTC, reste: Math.round((amountTTC-paid)*100)/100};
  },
  render(){
    const list = Store.all('situations').filter(s=>{
      if(Situations.filter.projectId && s.projectId!==Situations.filter.projectId) return false;
      if(Situations.filter.status && s.status!==Situations.filter.status) return false;
      if(Situations.filter.q && !(s.number||'').toLowerCase().includes(Situations.filter.q.toLowerCase())) return false;
      return true;
    }).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
    const pg = Pager.slice(Situations.filter, list);
    const totalTTC = Store.all('situations').reduce((s,x)=>s+(Number(x.amountTTC)||0),0);
    const totalPaid = Store.all('situations').reduce((s,x)=>s+(Number(x.paid)||0),0);

    const html = `
      <div class="view-head">
        <div><h2>Situations de travaux</h2><div class="sub">${Store.all('situations').length} situation(s) · Reste à encaisser : ${Utils.fmtMoney(totalTTC-totalPaid)}</div></div>
        <div class="view-actions"><button class="btn" id="btnNewSituation">+ Nouvelle situation</button></div>
      </div>
      <div class="filters-row">
        <input type="text" id="sitSearch" placeholder="Rechercher un numéro..." value="${Utils.escapeHtml(Situations.filter.q)}">
        <select id="sitProjectFilter">${Utils.optionsHtml(Store.projectsOptions(), Situations.filter.projectId, 'Tous les chantiers')}</select>
        <select id="sitStatusFilter">${Utils.optionsHtml(SITUATION_STATUSES, Situations.filter.status, 'Tous les statuts')}</select>
      </div>
      <div class="card">
        ${renderTable({columns:[
          {label:'N°', render:s=>`<b>${Utils.escapeHtml(s.number)}</b>`},
          {label:'Chantier', render:s=>Utils.escapeHtml(Store.projectName(s.projectId))},
          {label:'Période', render:s=>Utils.escapeHtml(s.period||'—')},
          {label:'Montant TTC', num:true, render:s=>Utils.fmtMoney(s.amountTTC)},
          {label:'Payé', num:true, render:s=>Utils.fmtMoney(s.paid)},
          {label:'Reste', num:true, render:s=>Utils.fmtMoney(situationReste(s))},
          {label:'Échéance', render:s=>{

            const days = Utils.daysBetween(situationDueDate(s), Utils.todayISO());
            return days>0 ? `${Utils.fmtDate(situationDueDate(s))} <span class="badge b-red">Retard ${days}j</span>` : Utils.fmtDate(situationDueDate(s));
          }},
          {label:'Statut', render:s=>Utils.badge(s.status)},
          {label:'', actions:true, render:s=>`<div class="row-actions"><button class="icon-btn-sq" data-to-invoice-sit="${s.id}" title="Convertir en facture" style="color:var(--primary);">🧾</button><button class="icon-btn-sq" data-print-sit="${s.id}" title="Imprimer">🖨️</button><button class="icon-btn-sq" data-pdf-sit="${s.id}" title="Télécharger PDF">⬇️</button><button class="icon-btn-sq" data-edit-sit="${s.id}" title="Modifier">✏️</button><button class="icon-btn-sq danger" data-del-sit="${s.id}" title="Supprimer">🗑️</button></div>`},
        ], rows:pg.items, emptyIcon:'📈', emptyTitle:'Aucune situation', emptyText:'Créez une situation de travaux pour un chantier.'})}
        ${Pager.html(Situations.filter, pg.totalPages, pg.total)}
      </div>
    `;
    setTimeout(()=>{
      document.getElementById('btnNewSituation').addEventListener('click', ()=>Situations.openForm());
      document.getElementById('sitSearch').addEventListener('input', Utils.debounce(e=>{ Situations.filter.q=e.target.value; Situations.filter.page=1; renderView(); document.getElementById('sitSearch').focus(); },250));
      document.getElementById('sitProjectFilter').addEventListener('change', e=>{ Situations.filter.projectId=e.target.value; Situations.filter.page=1; renderView(); });
      document.getElementById('sitStatusFilter').addEventListener('change', e=>{ Situations.filter.status=e.target.value; Situations.filter.page=1; renderView(); });
      document.querySelectorAll('[data-edit-sit]').forEach(el=>el.addEventListener('click', ()=>Situations.openForm(el.dataset.editSit)));
      document.querySelectorAll('[data-del-sit]').forEach(el=>el.addEventListener('click', ()=>Situations.remove(el.dataset.delSit)));
      document.querySelectorAll('[data-print-sit]').forEach(el=>el.addEventListener('click', ()=>Situations.print(el.dataset.printSit)));
      document.querySelectorAll('[data-pdf-sit]').forEach(el=>el.addEventListener('click', ()=>Situations.downloadPdf(el.dataset.pdfSit)));
      document.querySelectorAll('[data-to-invoice-sit]').forEach(el=>el.addEventListener('click', ()=>Invoices.createFromSituation(el.dataset.toInvoiceSit)));
      Pager.wire(Situations.filter, pg.totalPages);
    },0);
    return html;
  },
  openForm(id, presetProjectId, onDone){
    const editing = id ? Store.get('situations', id) : null;
    const d = editing || {number:'', projectId:presetProjectId||'', period:'', progress:0, amountHT:0, retenuePct:Store.state.settings.retenueDefault||10, tva:Store.state.settings.tvaDefault||20, paid:0, status:'Brouillon', dueDate:Utils.addDays(Utils.todayISO(),30)};
    UI.openModal({
      title: editing ? 'Modifier la situation' : 'Nouvelle situation', wide:true,
      bodyHtml:`<form id="sitForm"><div class="form-grid">
        <div class="form-group half"><label>Chantier *</label><select name="projectId" id="sitProjectSel" required>${Utils.optionsHtml(Store.projectsOptions(), d.projectId, '— Sélectionner —')}</select></div>
