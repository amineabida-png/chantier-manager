        <div class="form-group half"><label>Avancement (%)</label><input type="number" name="progress" value="${d.progress}" min="0" max="100"></div>
        <div class="form-group third"><label>Montant travaux HT (DH)</label><input type="number" name="amountHT" id="sitAmount" value="${d.amountHT}" step="0.01"></div>
        <div class="form-group third"><label>Retenue de garantie (%)</label><input type="number" name="retenuePct" id="sitRetenue" value="${d.retenuePct}" step="0.01"></div>
        <div class="form-group third"><label>TVA (%)</label><input type="number" name="tva" id="sitTva" value="${d.tva}" step="0.01"></div>
        <div class="form-group half"><label>Montant déjà payé (DH)</label><input type="number" name="paid" id="sitPaid" value="${d.paid}" step="0.01"></div>
        <div class="form-group half"><label>Statut</label><select name="status">${Utils.optionsHtml(SITUATION_STATUSES, d.status)}</select></div>
        <div class="form-group half"><label>Date d'échéance</label><input type="date" name="dueDate" value="${Utils.escapeHtml(d.dueDate||'')}"><div class="form-hint">Par défaut 30 jours après création si laissé vide.</div></div>
      </div>
      <div class="divider"></div>
      <div class="totals" style="margin-left:auto;max-width:300px;">
        <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>Retenue de garantie</span><b id="sitCalcRetenue">0,00 DH</b></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>TVA</span><b id="sitCalcTva">0,00 DH</b></div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-top:2px solid var(--border);font-size:15px;"><span>Montant TTC</span><b id="sitCalcTTC">0,00 DH</b></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;color:var(--danger);"><span>Reste à payer</span><b id="sitCalcReste">0,00 DH</b></div>
      </div>
      </form>`,
      footHtml:`<button class="btn btn-outline" id="cancelSit">Annuler</button><button class="btn" id="saveSit">Enregistrer</button>`,
      onOpen(overlay){
        function recalc(){
          const amountHT = parseFloat(overlay.querySelector('#sitAmount').value)||0;
          const retenuePct = parseFloat(overlay.querySelector('#sitRetenue').value)||0;
          const tva = parseFloat(overlay.querySelector('#sitTva').value)||0;
          const paid = parseFloat(overlay.querySelector('#sitPaid').value)||0;
          const t = Situations.compute(amountHT, retenuePct, tva, paid);
          overlay.querySelector('#sitCalcRetenue').textContent = Utils.fmtMoney(t.retenue);
          overlay.querySelector('#sitCalcTva').textContent = Utils.fmtMoney(t.tvaAmount);
          overlay.querySelector('#sitCalcTTC').textContent = Utils.fmtMoney(t.amountTTC);
          overlay.querySelector('#sitCalcReste').textContent = Utils.fmtMoney(t.reste);
        }
        ['sitAmount','sitRetenue','sitTva','sitPaid'].forEach(id=>overlay.querySelector('#'+id).addEventListener('input', recalc));
        if(!editing){
          overlay.querySelector('#sitProjectSel').addEventListener('change', (e)=>{
            if(e.target.value) overlay.querySelector('#sitNumber').value = Situations.nextNumber(e.target.value);
          });
          if(d.projectId) overlay.querySelector('#sitNumber').value = Situations.nextNumber(d.projectId);
        }
        recalc();
        overlay.querySelector('#cancelSit').addEventListener('click', UI.closeModal);
        overlay.querySelector('#saveSit').addEventListener('click', ()=>{
          const fd = new FormData(overlay.querySelector('#sitForm'));
          if(!fd.get('projectId')){ UI.toast('Le chantier est obligatoire.','error'); return; }
          const amountHT = parseFloat(fd.get('amountHT'))||0, retenuePct = parseFloat(fd.get('retenuePct'))||0, tva = parseFloat(fd.get('tva'))||0, paid = parseFloat(fd.get('paid'))||0;
          const t = Situations.compute(amountHT, retenuePct, tva, paid);
          const data = {
            projectId:fd.get('projectId'), number: fd.get('number')||Situations.nextNumber(fd.get('projectId')), period:fd.get('period'),
            progress:Utils.clamp(parseFloat(fd.get('progress'))||0,0,100), amountHT, retenuePct, tva, paid,
            retenue:t.retenue, tvaAmount:t.tvaAmount, amountTTC:t.amountTTC, status:fd.get('status'),
            dueDate: fd.get('dueDate')||null,
          };
          if(editing) Store.update('situations', id, data); else Store.add('situations', data);
          UI.closeModal(); UI.toast(editing?'Situation mise à jour.':'Situation créée.', 'success');
          renderView(); renderNav();
          if(onDone) onDone();
        });
      }
    });
  },
  openView(id){ Situations.print(id); },
  remove(id, onDone){
    UI.confirm('Supprimer cette situation ?', ()=>{ Store.remove('situations', id); UI.toast('Situation supprimée.','success'); renderView(); if(onDone) onDone(); });
  },
  print(id){
    const s = Store.get('situations', id);
    const p = Store.get('projects', s.projectId);
    const c = p ? Store.get('clients', p.clientId) : null;
    const company = Store.state.settings.company;
    const html = `
      <div class="print-doc">
        <div class="ph">
          <div>
            ${company.logo ? `<img src="${company.logo}" style="max-height:60px;max-width:180px;margin-bottom:8px;">` : ''}
            <h1>${Utils.escapeHtml(company.name||'Mon Entreprise')}</h1>

            <div>${Utils.escapeHtml(company.phone||'')} ${company.email?(' · '+Utils.escapeHtml(company.email)):''}</div>
          </div>
          <div style="text-align:right;">
            <h1>SITUATION DE TRAVAUX</h1>
            <div><b>${Utils.escapeHtml(s.number)}</b></div>
            <div>Période : ${Utils.escapeHtml(s.period||'—')}</div>
            <div>Échéance : ${Utils.fmtDate(situationDueDate(s))}</div>
          </div>
        </div>
        <div style="margin-bottom:14px;">
          <div><b>Chantier :</b> ${Utils.escapeHtml(p?p.name:'—')} ${p&&p.city?('— '+Utils.escapeHtml(p.city)):''}</div>
          <div><b>Client :</b> ${Utils.escapeHtml(c?c.name:'—')}</div>
          <div><b>Avancement :</b> ${s.progress||0}%</div>
        </div>
        <table>
          <thead><tr><th>Description</th><th>Montant</th></tr></thead>
          <tbody>
            <tr><td>Montant des travaux réalisés (HT)</td><td>${Utils.fmtMoney(s.amountHT)}</td></tr>
            <tr><td>Retenue de garantie (${s.retenuePct}%)</td><td>-${Utils.fmtMoney(s.retenue)}</td></tr>
            <tr><td>TVA (${s.tva}%)</td><td>${Utils.fmtMoney(s.tvaAmount)}</td></tr>
          </tbody>
        </table>
        <div class="totals">
          <div class="grand"><span>Montant TTC</span><b>${Utils.fmtMoney(s.amountTTC)}</b></div>
          <div><span>Déjà payé</span><b>${Utils.fmtMoney(s.paid)}</b></div>
          <div><span>Reste à payer</span><b>${Utils.fmtMoney(situationReste(s))}</b></div>
        </div>
        <p style="margin-top:40px;font-size:11.5px;color:#555;">Situation générée par CHANTIER MANAGER.</p>
      </div>`;
    printHtml(html);
  },
  downloadPdf(id){
    const jsPDFClass = Pdf.ensure(); if(!jsPDFClass) return;
    const s = Store.get('situations', id);
    const p = Store.get('projects', s.projectId);
    const c = p ? Store.get('clients', p.clientId) : null;
    const company = Store.state.settings.company;
    const doc = new jsPDFClass({unit:'mm', format:'a4'});
    let y = Pdf.header(doc, company, 'SITUATION', [
      s.number, 'Période : '+(s.period||'—'), 'Échéance : '+Utils.fmtDate(situationDueDate(s))
    ]);
    y = Pdf.infoBlock(doc, y, 'DÉTAILS', [
      `Chantier : ${p?p.name:'—'}${p&&p.city?(' — '+p.city):''}`,
      `Client : ${c?c.name:'—'}`,
      `Avancement : ${s.progress||0}%`,
    ]);
    y = Pdf.table(doc, y, [
      {header:'DESCRIPTION', width:130, render:r=>r.label},
      {header:'MONTANT', width:52, align:'right', render:r=>r.value},
    ], [
      {label:'Montant des travaux réalisés (HT)', value:Utils.fmtMoney(s.amountHT)},
      {label:`Retenue de garantie (${s.retenuePct}%)`, value:'-'+Utils.fmtMoney(s.retenue)},
      {label:`TVA (${s.tva}%)`, value:Utils.fmtMoney(s.tvaAmount)},
    ]);
    y = Pdf.totalsBlock(doc, y+4, [
      {label:'Montant TTC', value:Utils.fmtMoney(s.amountTTC), strong:true},
      {label:'Déjà payé', value:Utils.fmtMoney(s.paid)},
      {label:'Reste à payer', value:Utils.fmtMoney(situationReste(s))},
    ]);
    Pdf.footer(doc, 'Situation générée par CHANTIER MANAGER');
    doc.save(`${s.number}.pdf`);
  }
};

/* ===================== REPORTS ===================== */
const Reports = {
  selected:'',
  tvaMonth: (()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })(),
  tvaSummary(monthKey){
    const invoicesInMonth = Store.all('invoices').filter(inv=>(inv.date||'').startsWith(monthKey));
    const expensesInMonth = Store.all('expenses').filter(e=>(e.date||'').startsWith(monthKey));
    const collectee = invoicesInMonth.reduce((s,inv)=>s+(Number(inv.tvaAmount)||0),0);
    const deductible = expensesInMonth.reduce((s,e)=>{
      const ht = Number(e.amountHT)||0, tva = Number(e.tva)||0;
      return s + Math.round(ht*tva/100*100)/100;
    },0);
    return { collectee, deductible, due: Math.round((collectee-deductible)*100)/100, invoicesCount: invoicesInMonth.length, expensesCount: expensesInMonth.length };
  },
  tvaHtml(){
    const t = Reports.tvaSummary(Reports.tvaMonth);
    return `<div class="card" style="margin-bottom:18px;">
      <div class="card-head">
        <div><div class="section-title">Récapitulatif TVA (indicatif)</div><div class="sub" style="font-size:11.5px;color:var(--text-muted);">Basé sur les factures émises et les dépenses du mois — à vérifier avec votre comptable avant toute déclaration officielle.</div></div>
        <input type="month" id="tvaMonthSel" value="${Reports.tvaMonth}">
      </div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));">
        <div class="stat-mini"><span class="v">${Utils.fmtMoney(t.collectee)}</span><span class="l">TVA collectée (${t.invoicesCount} facture(s))</span></div>
        <div class="stat-mini"><span class="v">${Utils.fmtMoney(t.deductible)}</span><span class="l">TVA déductible (${t.expensesCount} dépense(s))</span></div>
        <div class="stat-mini"><span class="v" style="color:${t.due>=0?'var(--danger)':'var(--success)'}">${Utils.fmtMoney(Math.abs(t.due))}</span><span class="l">${t.due>=0?'TVA due':'Crédit de TVA'}</span></div>
      </div>
    </div>`;
  },
  render(){
    const projects = Store.all('projects');
    if(!Reports.selected && projects.length) Reports.selected = projects[0].id;
    const p = Reports.selected ? Store.get('projects', Reports.selected) : null;

    const html = `
      <div class="view-head">
        <div><h2>Rapports</h2><div class="sub">Analyse financière détaillée par chantier</div></div>
        <div class="view-actions">
          <select id="reportProjectSel">${Utils.optionsHtml(Store.projectsOptions(), Reports.selected, projects.length?undefined:'Aucun chantier')}</select>
          <button class="btn btn-outline" id="btnPrintReport" ${p?'':'disabled'}>🖨️ Imprimer le rapport</button>
          <button class="btn btn-outline" id="btnPdfReport" ${p?'':'disabled'}>⬇️ Télécharger PDF</button>
        </div>
      </div>
      ${Reports.tvaHtml()}
      ${p ? Reports.projectReportHtml(p) : `<div class="card"><div class="empty-state"><div class="es-ic">📑</div><h4>Aucun chantier</h4><p>Créez un chantier pour générer un rapport.</p></div></div>`}
      <div class="divider"></div>
      ${Reports.globalOverviewHtml()}
    `;
    setTimeout(()=>{
      const sel = document.getElementById('reportProjectSel');
      if(sel) sel.addEventListener('change', e=>{ Reports.selected = e.target.value; renderView(); });
      const pb = document.getElementById('btnPrintReport');
      if(pb) pb.addEventListener('click', ()=>Reports.print(Reports.selected));
      const pdfb = document.getElementById('btnPdfReport');
      if(pdfb) pdfb.addEventListener('click', ()=>Reports.downloadPdf(Reports.selected));
      const tvaSel = document.getElementById('tvaMonthSel');
      if(tvaSel) tvaSel.addEventListener('change', e=>{ Reports.tvaMonth = e.target.value; renderView(); });
      const canvas = document.getElementById('reportChart');
      if(canvas && p){
        const m = Reports.metrics(p);
        Chart.drawGroupedBars(canvas, ["Coûts"], [
          {name:'Matériaux', color:'#f59e0b', values:[m.materiaux]},
          {name:"Main-d'œuvre", color:'#0891b2', values:[m.mainOeuvre]},
          {name:'Sous-traitance', color:'#dc2626', values:[m.sousTraitance]},
        ]);
      }
    },0);
    return html;
  },
  metrics(p){
    const expensesList = Store.all('expenses').filter(e=>e.projectId===p.id);
    const depensesHT = expensesList.reduce((s,e)=>s+(Number(e.amountHT)||0),0);
    const depensesTTC = expensesList.reduce((s,e)=>s+(Number(e.amountTTC)||0),0);
    const mainOeuvre = Store.all('employees').filter(e=>e.projectId===p.id).reduce((s,e)=>s+employeeCost(e),0);
    const materiaux = Store.all('materials').filter(m=>m.projectId===p.id).reduce((s,m)=>s+(m.qty||0)*(m.unitPrice||0),0);
    const sousTraitance = expensesList.filter(e=>e.category==='Sous-traitance').reduce((s,e)=>s+(Number(e.amountHT)||0),0);
    const ca = Number(p.budgetHT)||0;
    const marge = ca - depensesHT;
    const margePct = ca>0 ? (marge/ca*100) : 0;
    const encaisse = Store.all('situations').filter(s=>s.projectId===p.id).reduce((s,st)=>s+(Number(st.paid)||0),0);
    const resteADepenser = (Number(p.budgetTTC)||0) - depensesTTC;
    const resteAEncaisser = (Number(p.budgetTTC)||0) - encaisse;
    return {depensesHT, depensesTTC, mainOeuvre, materiaux, sousTraitance, ca, marge, margePct, encaisse, resteADepenser, resteAEncaisser};
  },

function exportData(){
  const json = JSON.stringify(Store.state, null, 2);
  Utils.download('chantier-manager-export-'+Utils.todayISO()+'.json', json, 'application/json');
  UI.toast('Export JSON téléchargé.', 'success');
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(typeof data !== 'object' || data===null) throw new Error('format invalide');
      UI.confirm("Importer ce fichier remplacera toutes vos données actuelles. Continuer ?", ()=>{
        Store.state = migrateState(data);
        Store.persist();
        UI.toast('Données importées avec succès.', 'success');
        Router.navigate('dashboard');
      }, {okLabel:'Importer', danger:true});
    }catch(err){
      UI.toast("Fichier JSON invalide : "+err.message, 'error');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}
function setTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  Store.state.settings.theme = theme;
  Store.persist();
  document.getElementById('btnTheme').textContent = theme==='dark' ? '☀️' : '🌙';
}

/* ===================== APP BOOT ===================== */
function buildQuickAddMenu(){
  const menu = document.getElementById('quickAddMenu');
  const financeRoles = ['admin','comptable'];
  const allItems = [
    {icon:'🏗️', label:'Nouveau chantier', fn:()=>Projects.openForm()},
    {icon:'👥', label:'Nouveau client', fn:()=>Clients.openForm(), roles:financeRoles},
    {icon:'📄', label:'Nouveau devis', fn:()=>Quotes.openForm(), roles:financeRoles},
    {icon:'🧾', label:'Nouvelle facture', fn:()=>Invoices.openForm(), roles:financeRoles},
    {icon:'💸', label:'Nouvelle dépense', fn:()=>Expenses.openForm(), roles:financeRoles},
    {icon:'📈', label:'Nouvelle situation', fn:()=>Situations.openForm(), roles:financeRoles},
    {icon:'👷', label:'Nouvel employé', fn:()=>Employees.openForm()},
    {icon:'🧱', label:'Nouveau matériau', fn:()=>Materials.openForm()},
  ];
  const items = allItems.filter(it=>!it.roles || it.roles.includes(Auth.user && Auth.user.role));
  menu.innerHTML = items.map((it,i)=>`<button data-qmi="${i}">${it.icon} ${it.label}</button>`).join('');
  menu.querySelectorAll('[data-qmi]').forEach(btn=>btn.addEventListener('click', ()=>{ menu.classList.remove('open'); items[+btn.dataset.qmi].fn(); }));
}

function showConnectionError(){
  document.getElementById('splash').classList.remove('out');
  document.getElementById('splash').innerHTML = `
    <div class="splash-logo">⚠️</div>
    <div class="splash-title">Connexion impossible</div>
    <div class="splash-sub">Impossible de contacter le serveur. Vérifiez votre connexion internet puis réessayez.</div>
    <button class="btn" style="margin-top:16px;" onclick="location.reload()">Réessayer</button>
  `;
}
function showLoginScreen(){
  document.getElementById('splash').classList.add('out');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  const form = document.getElementById('loginForm');
  const errBox = document.getElementById('loginError');
  form.reset();
  errBox.classList.add('hidden');
  form.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(form);
    const btn = document.getElementById('loginSubmit');
    btn.disabled = true; btn.textContent = 'Connexion...';
    try{
      await Auth.login(fd.get('username'), fd.get('password'));
      location.reload();
    }catch(err){
      errBox.textContent = err.message;
      errBox.classList.remove('hidden');
    }finally{
      btn.disabled = false; btn.textContent = 'Se connecter';
    }
  };
}
async function boot(){
  let user;
  try{ user = await Auth.me(); }
  catch(e){ console.error('Erreur de vérification de session', e); showConnectionError(); return; }
  if(!user){ showLoginScreen(); return; }
  await startApp();
}
async function startApp(){
  try{
    await Store.init();
  }catch(e){
    console.error('Impossible de charger les données depuis le serveur', e);
    if(e && e.authExpired){ showLoginScreen(); return; }
    showConnectionError();
    return;
  }

  const theme = Store.state.settings.theme || 'light';
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('btnTheme').textContent = theme==='dark' ? '☀️' : '🌙';

  document.getElementById('userAvatar').textContent = (Auth.user.name||Auth.user.username||'?').slice(0,2).toUpperCase();
  document.getElementById('userMiniName').textContent = Auth.user.name || Auth.user.username;
  document.getElementById('userMiniRole').textContent = Auth.roleLabel(Auth.user.role);
  document.getElementById('btnLogout').addEventListener('click', async ()=>{
    UI.confirm('Se déconnecter ?', async ()=>{
      await Auth.logout();
      location.reload();
    }, {okLabel:'Se déconnecter', danger:false});
  });

  if(Store.firstRun){
    seedDemoData();
  }

  buildQuickAddMenu();
  renderNav();
  Router.navigate('dashboard');

  document.getElementById('btnMenu').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarBackdrop').classList.toggle('show');
  });
  document.getElementById('sidebarBackdrop').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarBackdrop').classList.remove('show');
  });
  document.getElementById('btnTheme').addEventListener('click', ()=>{
    setTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark');
  });
  document.getElementById('btnQuickAdd').addEventListener('click', (e)=>{
    e.stopPropagation();
    document.getElementById('quickAddMenu').classList.toggle('open');
  });
  document.addEventListener('click', ()=>{
    document.getElementById('quickAddMenu').classList.remove('open');
    document.getElementById('searchResults').classList.add('hidden');
  });
  document.getElementById('globalSearch').addEventListener('input', Utils.debounce(e=>runGlobalSearch(e.target.value), 200));
  document.getElementById('globalSearch').addEventListener('click', e=>e.stopPropagation());
  document.getElementById('searchResults').addEventListener('click', e=>e.stopPropagation());
  window.addEventListener('resize', Utils.debounce(()=>{ if(Router.current==='dashboard' || Router.current==='reports') renderView(); }, 300));

  document.getElementById('app').classList.remove('hidden');
  setTimeout(()=>{ document.getElementById('splash').classList.add('out'); }, 600);

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(err=>console.error('SW registration failed', err));
    });
  }

  window.addEventListener('beforeunload', ()=>{
    if(Storage._timer){
      clearTimeout(Storage._timer);
      try{
        const blob = new Blob([JSON.stringify(Store.state)], {type:'application/json'});
        navigator.sendBeacon('/api/state', blob);
      }catch(e){}
    }
  });
}
document.addEventListener('DOMContentLoaded', boot);
