name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chantier_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chantier_manager_test
      SESSION_SECRET: ci-test-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-test-password
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server.js syntax
        run: node --check server.js

      - name: Start server
        run: |
          node server.js &
          echo $! > server.pid
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/health; then
              echo "Server is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time" >&2
          exit 1

      - name: Sign up a new organization (multi-tenant smoke test)
        run: |
          curl -sf -X POST http://localhost:3000/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"orgName":"CI Test Org","username":"ci-user","password":"ci-pass-1234","name":"CI User"}' \
            -o signup-response.json
          cat signup-response.json
          grep -q '"username":"ci-user"' signup-response.json

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
