name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chantier_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chantier_manager_test
      SESSION_SECRET: ci-test-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-test-password
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server.js syntax
        run: node --check server.js

      - name: Start server and check /api/health
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/health; then
              echo "Server is healthy"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time" >&2
          kill $SERVER_PID
          exit 1
